<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Remote access platform">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".25"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="114" y="85.25" width="272" height="229.5" rx="24" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="376" y="161" width="448" height="378" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="814" y="385.25" width="272" height="229.5" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M250 200 L600 350" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M250 200 L950 500" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.5s"/><g transform="translate(250 200) scale(0.85)" class="float"><rect x="-150" y="-105" width="300" height="210" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M-150 -71H150" stroke="rgba(255,255,255,.14)"/><circle cx="-128" cy="-88" r="5" fill="#ff6b6b" /><circle cx="-110" cy="-88" r="5" fill="#fbbf24" /><circle cx="-92" cy="-88" r="5" fill="#34d399" /></g><g transform="translate(600 350) scale(1.4)" class=""><g><path d="M0 -100l80 30v62c0 56-36 92-80 112-44-20-80-56-80-112v-62z" fill="#f59e0b"/><circle cx="0" cy="-4" r="34" fill="#fff" /><path d="M-15.454545454545453 -4 l13.076923076923077 14.166666666666668 l21.25 -22.666666666666668" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(950 500) scale(0.85)" class=""><g><circle cx="-50" cy="0" r="44" fill="none" stroke="#2f80ff" stroke-width="14"/><circle cx="50" cy="0" r="44" fill="none" stroke="#f59e0b" stroke-width="14"/></g></g><g><rect x="465" y="612" width="270" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="479" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Remote access platform</text></g>
</svg>