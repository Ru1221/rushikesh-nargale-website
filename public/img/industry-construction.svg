<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Construction">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="328" y="100.5" width="544" height="459" rx="24" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="86" y="412.25" width="208" height="175.5" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="906" y="82.25" width="208" height="175.5" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M600 330 L190 500" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M600 330 L1010 170" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.5s"/><g transform="translate(600 330) scale(1.7)" class="float"><rect x="-150" y="-105" width="300" height="210" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M-150 -71H150" stroke="rgba(255,255,255,.14)"/><circle cx="-128" cy="-88" r="5" fill="#ff6b6b" /><circle cx="-110" cy="-88" r="5" fill="#fbbf24" /><circle cx="-92" cy="-88" r="5" fill="#34d399" /></g><g transform="translate(190 500) scale(0.65)" class=""><g><rect x="-80" y="-105" width="160" height="210" rx="12" fill="#16305f" stroke="rgba(255,255,255,.14)"/><path d="M52 -105v28h28" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="-64" y="-65" width="108" height="8" rx="4" fill="#8b5cf6" opacity="0.9"/><rect x="-64" y="-45" width="108" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="-64" y="-25" width="64" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="-64" y="-5" width="108" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="-64" y="15" width="108" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/></g></g><g transform="translate(1010 170) scale(0.65)" class=""><g><circle cx="0" cy="0" r="80" fill="#12295a" /><circle cx="0" cy="0" r="80" fill="none" stroke="#22d3ee" stroke-width="8"/><path d="M0 -44V0l30 20" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><g><rect x="432" y="612" width="336" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="446" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Construction and contracting</text></g>
