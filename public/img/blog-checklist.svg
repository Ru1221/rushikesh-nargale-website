<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A checklist to review before automating">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="280" y="90" width="640" height="500" rx="28" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><circle cx="340" cy="180" r="20" fill="#34d399" /><path d="M330.90909090909093 180 l7.692307692307692 8.333333333333334 l12.5 -13.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="188" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#e6eefc" text-anchor="start">Clear goal</text><rect x="380" y="205" width="220" height="6" rx="3" fill="#6f8ab8" opacity="0.4"/><circle cx="340" cy="256" r="20" fill="#34d399" /><path d="M330.90909090909093 256 l7.692307692307692 8.333333333333334 l12.5 -13.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#e6eefc" text-anchor="start">Owner named</text><rect x="380" y="281" width="210" height="6" rx="3" fill="#6f8ab8" opacity="0.4"/><circle cx="340" cy="332" r="20" fill="#34d399" /><path d="M330.90909090909093 332 l7.692307692307692 8.333333333333334 l12.5 -13.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#e6eefc" text-anchor="start">Data cleaned</text><rect x="380" y="357" width="200" height="6" rx="3" fill="#6f8ab8" opacity="0.4"/><circle cx="340" cy="408" r="20" fill="#34d399" /><path d="M330.90909090909093 408 l7.692307692307692 8.333333333333334 l12.5 -13.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#e6eefc" text-anchor="start">Tested with real cases</text><rect x="380" y="433" width="190" height="6" rx="3" fill="#6f8ab8" opacity="0.4"/><circle cx="340" cy="484" r="20" fill="#fbbf24" /><path d="M330.90909090909093 484 l7.692307692307692 8.333333333333334 l12.5 -13.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#e6eefc" text-anchor="start">Fallback to a person</text><rect x="380" y="509" width="180" height="6" rx="3" fill="#6f8ab8" opacity="0.4"/>
</svg>