<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Solutions for different industries">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="80" y="100" width="280" height="300" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="460" y="100" width="280" height="300" rx="24" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="840" y="100" width="280" height="300" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><g transform="translate(130 130)"><rect x="40" y="130" width="60" height="140" rx="6" fill="#2f80ff" stroke="rgba(255,255,255,.14)"/><rect x="110" y="90" width="60" height="180" rx="6" fill="#22d3ee" stroke="rgba(255,255,255,.14)"/><rect x="180" y="150" width="60" height="120" rx="6" fill="#2f80ff" stroke="rgba(255,255,255,.14)"/></g><g transform="translate(500 140)"><rect x="6" y="140" width="38" height="80" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0s"/><rect x="56" y="80" width="38" height="140" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.15s"/><rect x="106" y="109.99999999999999" width="38" height="110.00000000000001" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0.3s"/><rect x="156" y="40" width="38" height="180" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.44999999999999996s"/></g><g transform="translate(940 200)"><g transform="translate(0 40) scale(1.6)"><circle cx="0" cy="-22" r="18" fill="#34d399" /><path d="M-34 36c0-24 15-38 34-38s34 14 34 38z" fill="#34d399" opacity=".85"/></g><g transform="translate(70 60) scale(1.2)"><circle cx="0" cy="-22" r="18" fill="#22d3ee" /><path d="M-34 36c0-24 15-38 34-38s34 14 34 38z" fill="#22d3ee" opacity=".85"/></g></g><text x="220" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Construction</text><text x="600" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Finance</text><text x="980" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Services & HR</text>
</svg>