<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Leads moving through a sales pipeline with automated follow-ups">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<g class="float"><path d="M150 110h420l-142.8 190v190l-134.4 -45.6v-144.4z" fill="#2f80ff" opacity=".9"/></g><g transform="translate(250 90) scale(0.7)"><circle cx="0" cy="-22" r="18" fill="#22d3ee" /><path d="M-34 36c0-24 15-38 34-38s34 14 34 38z" fill="#22d3ee" opacity=".85"/></g><g transform="translate(360 90) scale(0.7)"><circle cx="0" cy="-22" r="18" fill="#2f80ff" /><path d="M-34 36c0-24 15-38 34-38s34 14 34 38z" fill="#2f80ff" opacity=".85"/></g><g transform="translate(470 90) scale(0.7)"><circle cx="0" cy="-22" r="18" fill="#34d399" /><path d="M-34 36c0-24 15-38 34-38s34 14 34 38z" fill="#34d399" opacity=".85"/></g><rect x="700" y="150" width="400" height="360" rx="22" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="730" y="205" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="start">Pipeline</text><rect x="730" y="240" width="290" height="14" rx="7" fill="#6f8ab8" opacity="0.9"/><text x="1040" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#6f8ab8" text-anchor="start">New</text><rect x="730" y="298" width="220" height="14" rx="7" fill="#2f80ff" opacity="0.9"/><text x="970" y="311" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#6f8ab8" text-anchor="start">Contacted</text><rect x="730" y="356" width="150" height="14" rx="7" fill="#22d3ee" opacity="0.9"/><text x="900" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#6f8ab8" text-anchor="start">Proposal</text><rect x="730" y="414" width="80" height="14" rx="7" fill="#34d399" opacity="0.9"/><text x="830" y="427" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#6f8ab8" text-anchor="start">Won</text><g><rect x="300" y="540" width="230" height="56" rx="18" fill="#2f80ff"/><path d="M322 594l-12 18l30 -18z" fill="#2f80ff"/><rect x="320" y="562" width="190" height="8" rx="4" fill="#fff" opacity="0.85"/></g><g><rect x="580" y="548" width="182" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="594" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Auto follow-up</text></g>
</svg>