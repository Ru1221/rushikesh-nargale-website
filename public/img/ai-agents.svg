<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An AI agent using several business tools to complete a task">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<path d="M600 337 L250 200" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L250 200" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M600 337 L250 475" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L250 475" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.3s"/><path d="M600 337 L950 200" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L950 200" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.6s"/><path d="M600 337 L950 475" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L950 475" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.8999999999999999s"/><g class="float"><circle cx="600" cy="337" r="96" fill="#12295a" /><circle cx="600" cy="320" r="36" fill="#22d3ee" /><path d="M545 395c0-30 25-48 55-48s55 18 55 48z" fill="#22d3ee"/><circle cx="586" cy="316" r="5" fill="#081226" /><circle cx="614" cy="316" r="5" fill="#081226" /></g><rect x="130" y="160" width="240" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="250" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="middle">Email</text><rect x="130" y="435" width="240" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="250" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="middle">Calendar</text><rect x="830" y="160" width="240" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="950" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="middle">CRM</text><rect x="830" y="435" width="240" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="950" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="middle">Sheets</text><g><rect x="480" y="560" width="281" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="494" y="584" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Plan  →  Act  →  Review</text></g>
</svg>