<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A chatbot answering a customer question">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="300" y="80" width="600" height="520" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M300 114H900" stroke="rgba(255,255,255,.14)"/><circle cx="322" cy="97" r="5" fill="#ff6b6b" /><circle cx="340" cy="97" r="5" fill="#fbbf24" /><circle cx="358" cy="97" r="5" fill="#34d399" /><text x="600" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6f8ab8" text-anchor="middle">Website chat</text><g><rect x="340" y="150" width="300" height="70" rx="18" fill="#12295a"/><path d="M362 218l-12 18l30 -18z" fill="#12295a"/><rect x="360" y="172" width="260" height="8" rx="4" fill="#fff" opacity="0.85"/><rect x="360" y="192" width="224" height="8" rx="4" fill="#fff" opacity="0.85"/></g><g><rect x="560" y="250" width="300" height="70" rx="18" fill="#2f80ff"/><path d="M838 318l12 18l-30 -18z" fill="#2f80ff"/><rect x="580" y="272" width="260" height="8" rx="4" fill="#fff" opacity="0.85"/><rect x="580" y="292" width="224" height="8" rx="4" fill="#fff" opacity="0.85"/></g><g><rect x="340" y="350" width="330" height="90" rx="18" fill="#12295a"/><path d="M362 438l-12 18l30 -18z" fill="#12295a"/><rect x="360" y="372" width="290" height="8" rx="4" fill="#fff" opacity="0.85"/><rect x="360" y="392" width="254" height="8" rx="4" fill="#fff" opacity="0.85"/><rect x="360" y="412" width="218" height="8" rx="4" fill="#fff" opacity="0.85"/></g><g class="float"><g><rect x="580" y="470" width="260" height="60" rx="18" fill="#22d3ee"/><path d="M818 528l12 18l-30 -18z" fill="#22d3ee"/><rect x="600" y="492" width="220" height="8" rx="4" fill="#fff" opacity="0.85"/></g></g><rect x="330" y="540" width="540" height="40" rx="20" fill="#081226" stroke="rgba(255,255,255,.14)"/><rect x="350" y="556" width="200" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="845" cy="560" r="14" fill="#2f80ff" />
</svg>