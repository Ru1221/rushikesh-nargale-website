<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Four steps from discovery to handover">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="70" y="210" width="240" height="250" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><circle cx="190" cy="275" r="32" fill="#2f80ff" /><text x="190" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#081226" text-anchor="middle">1</text><text x="190" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6eefc" text-anchor="middle">Discovery</text><rect x="120" y="395" width="140" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="120" y="420" width="100" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="350" y="210" width="240" height="250" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><circle cx="470" cy="275" r="32" fill="#22d3ee" /><text x="470" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#081226" text-anchor="middle">2</text><text x="470" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6eefc" text-anchor="middle">Design</text><rect x="400" y="395" width="140" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="400" y="420" width="100" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="630" y="210" width="240" height="250" rx="24" fill="#12295a" stroke="rgba(255,255,255,.14)"/><circle cx="750" cy="275" r="32" fill="#2f80ff" /><text x="750" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#081226" text-anchor="middle">3</text><text x="750" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6eefc" text-anchor="middle">Build</text><rect x="680" y="395" width="140" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="680" y="420" width="100" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="910" y="210" width="240" height="250" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><circle cx="1030" cy="275" r="32" fill="#34d399" /><text x="1030" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#081226" text-anchor="middle">4</text><text x="1030" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6eefc" text-anchor="middle">Handover</text><rect x="960" y="395" width="140" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="960" y="420" width="100" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><path d="M310 335 H350" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M590 335 H630" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.3s"/><path d="M870 335 H910" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.6s"/>
</svg>