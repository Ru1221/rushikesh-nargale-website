="pulse" style="animation-delay:0s"><circle cx="0" cy="-90" r="32" fill="#fbbf24" opacity=".18"/><circle cx="0" cy="-90" r="22" fill="#fbbf24" /></g></g><g transform="translate(1010 170) scale(0.65)" class=""><g class="float"><circle cx="0" cy="0" r="72" fill="none" stroke="#8b5cf6" stroke-width="32" stroke-dasharray="190 262"/><circle cx="0" cy="0" r="72" fill="none" stroke="#22d3ee" stroke-width="32" stroke-dasharray="120 332" stroke-dashoffset="-190"/><circle cx="0" cy="0" r="72" fill="none" stroke="#34d399" stroke-width="32" stroke-dasharray="60 392" stroke-dashoffset="-310"/></g></g><g><rect x="520" y="612" width="160" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="534" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Our projects</text></g>
