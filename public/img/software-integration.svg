<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Different business applications connected through an API hub">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<path d="M600 337 L200 160" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L200 160" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M600 337 L200 515" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L200 515" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.25s"/><path d="M600 337 L1000 160" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L1000 160" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.5s"/><path d="M600 337 L1000 515" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L1000 515" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.75s"/><path d="M600 337 L600 100" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M600 337 L600 100" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:1s"/><g class="pulse"><rect x="500" y="267" width="200" height="140" rx="24" fill="#2f80ff" stroke="rgba(255,255,255,.14)"/><text x="600" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="800" fill="#fff" text-anchor="middle">API</text></g><rect x="90" y="120" width="220" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="200" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Accounts</text><rect x="90" y="475" width="220" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="200" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">CRM</text><rect x="890" y="120" width="220" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="1000" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">HR</text><rect x="890" y="475" width="220" height="80" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="1000" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Sheets</text><rect x="490" y="40" width="220" height="70" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="600" y="85" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Website</text>
</svg>