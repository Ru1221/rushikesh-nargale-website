<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Expense and CRM workflows connected across applications">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="140" y="165" width="200" height="110" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="170" y="198" width="120" height="10" rx="5" fill="#6f8ab8" opacity="0.8"/><rect x="170" y="224" width="80" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="306" cy="250" r="12" fill="#34d399" /><path d="M300.54545454545456 250 l4.615384615384615 5 l7.5 -8" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="85" width="200" height="110" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="530" y="118" width="120" height="10" rx="5" fill="#22d3ee" opacity="0.8"/><rect x="530" y="144" width="80" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="666" cy="170" r="12" fill="#34d399" /><path d="M660.5454545454545 170 l4.615384615384615 5 l7.5 -8" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="860" y="165" width="200" height="110" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="890" y="198" width="120" height="10" rx="5" fill="#6f8ab8" opacity="0.8"/><rect x="890" y="224" width="80" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="1026" cy="250" r="12" fill="#34d399" /><path d="M1020.5454545454545 250 l4.615384615384615 5 l7.5 -8" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="425" width="200" height="110" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="350" y="458" width="120" height="10" rx="5" fill="#6f8ab8" opacity="0.8"/><rect x="350" y="484" width="80" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="486" cy="510" r="12" fill="#34d399" /><path d="M480.54545454545456 510 l4.615384615384615 5 l7.5 -8" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="680" y="425" width="200" height="110" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="710" y="458" width="120" height="10" rx="5" fill="#6f8ab8" opacity="0.8"/><rect x="710" y="484" width="80" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="846" cy="510" r="12" fill="#34d399" /><path d="M840.5454545454545 510 l4.615384615384615 5 l7.5 -8" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 200 L500 160" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M700 160 L860 200" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.3s"/><path d="M300 270 L350 430" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.6s"/><path d="M900 270 L860 430" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.9s"/><path d="M520 480 H680" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:1.2s"/><g><rect x="490" y="585" width="347" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="504" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Approvals  ·  Reports  ·  CRM</text></g>
