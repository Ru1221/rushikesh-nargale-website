<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Appointment booking with calendar and reminders">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<g class="float"><g><rect x="130" y="110" width="440" height="440" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="130" y="110" width="440" height="38" rx="16" fill="#2f80ff"/><circle cx="160" cy="184" r="11" fill="#12295a" /><circle cx="286.6666666666667" cy="184" r="11" fill="#12295a" /><circle cx="413.33333333333337" cy="184" r="11" fill="#12295a" /><circle cx="540" cy="184" r="11" fill="#12295a" /><circle cx="160" cy="224" r="11" fill="#12295a" /><circle cx="286.6666666666667" cy="224" r="11" fill="#12295a" /><circle cx="413.33333333333337" cy="224" r="11" fill="#22d3ee" /><circle cx="540" cy="224" r="11" fill="#12295a" /><circle cx="160" cy="264" r="11" fill="#12295a" /><circle cx="286.6666666666667" cy="264" r="11" fill="#12295a" /><circle cx="413.33333333333337" cy="264" r="11" fill="#12295a" /><circle cx="540" cy="264" r="11" fill="#12295a" /></g></g><rect x="640" y="130" width="430" height="120" rx="20" fill="#12295a" stroke="rgba(255,255,255,.14)"/><circle cx="700" cy="190" r="30" fill="#2f80ff" /><text x="700" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">10</text><text x="750" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="start">Booking confirmed</text><rect x="750" y="205" width="200" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="640" y="280" width="430" height="120" rx="20" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><circle cx="700" cy="340" r="30" fill="#22d3ee" /><path d="M700 322v20l14 8" stroke="#081226" stroke-width="5" fill="none" stroke-linecap="round"/><text x="750" y="335" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="start">Reminder sent</text><rect x="750" y="355" width="180" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="640" y="430" width="430" height="120" rx="20" fill="#12295a" stroke="rgba(255,255,255,.14)"/><circle cx="700" cy="490" r="28" fill="#34d399" /><path d="M687.2727272727273 490 l10.769230769230768 11.666666666666668 l17.5 -18.666666666666668" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6eefc" text-anchor="start">Added to calendar</text><rect x="750" y="505" width="160" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/>
</svg>