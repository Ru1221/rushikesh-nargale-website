="-26.666666666666664" cy="-26" r="11" fill="#12295a" /><circle cx="26.66666666666667" cy="-26" r="11" fill="#12295a" /><circle cx="80" cy="-26" r="11" fill="#12295a" /><circle cx="-80" cy="14" r="11" fill="#12295a" /><circle cx="-26.666666666666664" cy="14" r="11" fill="#12295a" /><circle cx="26.66666666666667" cy="14" r="11" fill="#2f80ff" /><circle cx="80" cy="14" r="11" fill="#12295a" /><circle cx="-80" cy="54" r="11" fill="#12295a" /><circle cx="-26.666666666666664" cy="54" r="11" fill="#12295a" /><circle cx="26.66666666666667" cy="54" r="11" fill="#12295a" /><circle cx="80" cy="54" r="11" fill="#12295a" /></g></g><g><rect x="536.5" y="612" width="127" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="550.5" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">AI agents</text></g>
