5.833333333333334 l8.75 -9.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="554" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#e6eefc" text-anchor="start">Accounts created</text><circle cx="800" cy="510" r="14" fill="#34d399" /><path d="M793.6363636363636 510 l5.384615384615384 5.833333333333334 l8.75 -9.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="824" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#e6eefc" text-anchor="start">Documents signed</text>
</svg>