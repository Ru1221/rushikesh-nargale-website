<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An agent searching tenders and tracking deadlines">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="100" y="110" width="600" height="460" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><g><circle cx="210" cy="220" r="56" fill="none" stroke="#22d3ee" stroke-width="8"/><path d="M250.32 260.32l39.199999999999996 39.199999999999996" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/></g><rect x="290" y="150" width="380" height="80" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="310" y="175" width="240" height="10" rx="5" fill="#22d3ee" opacity="0.95"/><rect x="310" y="200" width="160" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><circle cx="640" cy="190" r="14" fill="#34d399" /><path d="M633.6363636363636 190 l5.384615384615384 5.833333333333334 l8.75 -9.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="250" width="380" height="80" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="310" y="275" width="240" height="10" rx="5" fill="#6f8ab8" opacity="0.5"/><rect x="310" y="300" width="160" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="290" y="350" width="380" height="80" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="310" y="375" width="240" height="10" rx="5" fill="#6f8ab8" opacity="0.5"/><rect x="310" y="400" width="160" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="290" y="450" width="380" height="80" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="310" y="475" width="240" height="10" rx="5" fill="#6f8ab8" opacity="0.5"/><rect x="310" y="500" width="160" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><g class="float"><g><rect x="780" y="140" width="330" height="250" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="780" y="140" width="330" height="38" rx="16" fill="#2f80ff"/><circle cx="810" cy="214" r="11" fill="#12295a" /><circle cx="900" cy="214" r="11" fill="#12295a" /><circle cx="990" cy="214" r="11" fill="#12295a" /><circle cx="1080" cy="214" r="11" fill="#12295a" /><circle cx="810" cy="254" r="11" fill="#12295a" /><circle cx="900" cy="254" r="11" fill="#12295a" /><circle cx="990" cy="254" r="11" fill="#22d3ee" /><circle cx="1080" cy="254" r="11" fill="#12295a" /><circle cx="810" cy="294" r="11" fill="#12295a" /><circle cx="900" cy="294" r="11" fill="#12295a" /><circle cx="990" cy="294" r="11" fill="#12295a" /><circle cx="1080" cy="294" r="11" fill="#12295a" /></g></g><rect x="780" y="420" width="330" height="110" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="945" y="468" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">Deadline alert</text><text x="945" y="504" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#6f8ab8" text-anchor="middle">3 days left</text>
</svg>