<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A bill of quantities table being filled and totalled automatically">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="120" y="90" width="700" height="500" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M120 124H820" stroke="rgba(255,255,255,.14)"/><circle cx="142" cy="107" r="5" fill="#ff6b6b" /><circle cx="160" cy="107" r="5" fill="#fbbf24" /><circle cx="178" cy="107" r="5" fill="#34d399" /><text x="470" y="113" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6f8ab8" text-anchor="middle">BOQ</text><text x="160" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6f8ab8" text-anchor="start">Item</text><text x="320" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6f8ab8" text-anchor="start">Qty</text><text x="480" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6f8ab8" text-anchor="start">Rate</text><text x="640" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6f8ab8" text-anchor="start">Amount</text><rect x="160" y="195" width="110" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="320" y="195" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="480" y="195" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="640" y="195" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="160" y="247" width="110" height="12" rx="6" fill="#22d3ee" opacity="0.9"/><rect x="320" y="247" width="80" height="12" rx="6" fill="#22d3ee" opacity="0.9"/><rect x="480" y="247" width="80" height="12" rx="6" fill="#22d3ee" opacity="0.9"/><rect x="640" y="247" width="80" height="12" rx="6" fill="#22d3ee" opacity="0.9"/><rect x="160" y="299" width="110" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="320" y="299" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="480" y="299" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="640" y="299" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="160" y="351" width="110" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="320" y="351" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="480" y="351" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="640" y="351" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="160" y="403" width="110" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="320" y="403" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="480" y="403" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="640" y="403" width="80" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="160" y="480" width="620" height="70" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="190" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6f8ab8" text-anchor="start">Total</text><text x="750" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#22d3ee" text-anchor="end">Estimate ready</text><g class="float" transform="translate(880 150)"><rect x="0" y="0" width="220" height="330" rx="20" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="20" y="24" width="180" height="60" rx="10" fill="#081226" stroke="rgba(255,255,255,.14)"/><circle cx="50" cy="130" r="19" fill="#0f2144" /><circle cx="110" cy="130" r="19" fill="#0f2144" /><circle cx="170" cy="130" r="19" fill="#0f2144" /><circle cx="50" cy="182" r="19" fill="#0f2144" /><circle cx="110" cy="182" r="19" fill="#0f2144" /><circle cx="170" cy="182" r="19" fill="#0f2144" /><circle cx="50" cy="234" r="19" fill="#0f2144" /><circle cx="110" cy="234" r="19" fill="#0f2144" /><circle cx="170" cy="234" r="19" fill="#0f2144" /><circle cx="50" cy="286" r="19" fill="#0f2144" /><circle cx="110" cy="286" r="19" fill="#0f2144" /><circle cx="170" cy="286" r="19" fill="#22d3ee" /></g>
</svg>