" style="animation-delay:0s"><circle cx="0" cy="-90" r="32" fill="#fbbf24" opacity=".18"/><circle cx="0" cy="-90" r="22" fill="#fbbf24" /></g></g><g transform="translate(970 500) scale(0.7)" class=""><circle cx="0" cy="0" r="66" fill="#34d399" /><path d="M-29.999999999999996 0 l25.384615384615383 27.5 l41.25 -44" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="536.5" y="612" width="127" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="550.5" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Portfolio</text></g>
