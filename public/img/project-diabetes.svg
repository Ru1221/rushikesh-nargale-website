="#34d399" stroke-width="4" stroke-linecap="round"/><path d="M-77 -27.333333333333336h12M65 -27.333333333333336h12" stroke="#34d399" stroke-width="4" stroke-linecap="round"/><path d="M-77 -11.333333333333336h12M65 -11.333333333333336h12" stroke="#34d399" stroke-width="4" stroke-linecap="round"/><path d="M-77 4.666666666666664h12M65 4.666666666666664h12" stroke="#34d399" stroke-width="4" stroke-linecap="round"/><text x="0" y="9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">AI</text></g></g><g><rect x="498" y="612" width="204" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="512" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Prediction model</text></g>
