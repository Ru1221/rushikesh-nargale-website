<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A business process flowing from trigger through automated steps to done">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="70" y="230" width="220" height="210" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="180" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#22d3ee" text-anchor="middle">Trigger</text><g><rect x="130" y="310" width="100" height="100" rx="12" fill="#16305f" stroke="rgba(255,255,255,.14)"/><path d="M202 310v28h28" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="146" y="350" width="48" height="8" rx="4" fill="#2f80ff" opacity="0.9"/><rect x="146" y="370" width="48" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/><rect x="146" y="390" width="40" height="8" rx="4" fill="#6f8ab8" opacity="0.5"/></g><rect x="490" y="160" width="220" height="130" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="600" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Validate</text><circle cx="600" cy="255" r="16" fill="#34d399" /><path d="M592.7272727272727 255 l6.153846153846153 6.666666666666667 l10 -10.666666666666666" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="380" width="220" height="130" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="600" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Update records</text><rect x="566" y="470" width="14.666666666666668" height="20" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0s"/><rect x="592.6666666666666" y="458" width="14.666666666666668" height="32" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.15s"/><rect x="619.3333333333334" y="466" width="14.666666666666668" height="24" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0.3s"/><rect x="910" y="230" width="220" height="210" rx="18" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><text x="1020" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#34d399" text-anchor="middle">Done</text><circle cx="1020" cy="365" r="40" fill="#34d399" /><path d="M1001.8181818181819 365 l15.384615384615383 16.666666666666668 l25 -26.666666666666668" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 335 C390 335 390 225 490 225" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M290 335 C390 335 390 445 490 445" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M710 225 C810 225 810 335 910 335" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M710 445 C810 445 810 335 910 335" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M290 335 C390 335 390 225 490 225" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M290 335 C390 335 390 445 490 445" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.4s"/><path d="M710 225 C810 225 810 335 910 335" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.8s"/><path d="M710 445 C810 445 810 335 910 335" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:1.2s"/><text x="600" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#6f8ab8" text-anchor="middle">Repeatable steps, no manual copying</text>
</svg>