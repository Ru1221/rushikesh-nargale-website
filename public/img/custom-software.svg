<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A custom business dashboard application">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="150" y="90" width="900" height="500" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M150 124H1050" stroke="rgba(255,255,255,.14)"/><circle cx="172" cy="107" r="5" fill="#ff6b6b" /><circle cx="190" cy="107" r="5" fill="#fbbf24" /><circle cx="208" cy="107" r="5" fill="#34d399" /><text x="600" y="113" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6f8ab8" text-anchor="middle">Business dashboard</text><rect x="180" y="150" width="190" height="120" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="200" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#6f8ab8" text-anchor="start">Orders</text><text x="200" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="start">128</text><rect x="390" y="150" width="190" height="120" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="410" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#6f8ab8" text-anchor="start">Tasks</text><text x="410" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#22d3ee" text-anchor="start">42</text><rect x="600" y="150" width="190" height="120" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="620" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#6f8ab8" text-anchor="start">Reports</text><text x="620" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="start">16</text><rect x="810" y="150" width="210" height="120" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><g transform="translate(830 170)"><rect x="6" y="48" width="22" height="32" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0s"/><rect x="40" y="24" width="22" height="56" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.15s"/><rect x="74" y="40" width="22" height="40" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0.3s"/><rect x="108" y="8" width="22" height="72" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.44999999999999996s"/><rect x="142" y="32" width="22" height="48" rx="6" fill="#22d3ee" class="grow" style="animation-delay:0.6s"/></g><rect x="180" y="295" width="520" height="260" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="205" y="330" width="470" height="12" rx="6" fill="#22d3ee" opacity="0.9"/><rect x="205" y="374" width="470" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="205" y="418" width="470" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="205" y="462" width="470" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="205" y="506" width="470" height="12" rx="6" fill="#6f8ab8" opacity="0.45"/><rect x="720" y="295" width="300" height="260" rx="14" fill="#12295a" stroke="rgba(255,255,255,.14)"/><g class="float"><circle cx="870" cy="425" r="70" fill="none" stroke="#2f80ff" stroke-width="22" stroke-dasharray="260 180"/><circle cx="870" cy="425" r="70" fill="none" stroke="#22d3ee" stroke-width="22" stroke-dasharray="100 340" stroke-dashoffset="-260"/></g>
</svg>