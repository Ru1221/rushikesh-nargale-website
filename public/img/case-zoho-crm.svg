<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Zoho CRM dashboard">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".25"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="114" y="85.25" width="272" height="229.5" rx="24" fill="#12295a" stroke="rgba(255,255,255,.14)"/><rect x="376" y="161" width="448" height="378" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><rect x="814" y="385.25" width="272" height="229.5" rx="24" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M250 200 L600 350" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M250 200 L950 500" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.5s"/><g transform="translate(250 200) scale(0.85)" class="float"><path d="M-110 -110h220l-74.80000000000001 105v105l-70.4 -25.2v-79.8z" fill="#f59e0b" opacity=".9"/></g><g transform="translate(600 350) scale(1.4)" class=""><rect x="-94" y="12" width="28" height="68" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0s"/><rect x="-54" y="-56" width="28" height="136" rx="6" fill="#f59e0b" class="grow" style="animation-delay:0.15s"/><rect x="-14" y="-13.500000000000014" width="28" height="93.50000000000001" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.3s"/><rect x="26" y="-81.5" width="28" height="161.5" rx="6" fill="#f59e0b" class="grow" style="animation-delay:0.44999999999999996s"/><rect x="66" y="-38.999999999999986" width="28" height="118.99999999999999" rx="6" fill="#2f80ff" class="grow" style="animation-delay:0.6s"/></g><g transform="translate(950 500) scale(0.85)" class=""><g class="float"><circle cx="0" cy="0" r="72" fill="none" stroke="#f59e0b" stroke-width="32" stroke-dasharray="190 262"/><circle cx="0" cy="0" r="72" fill="none" stroke="#2f80ff" stroke-width="32" stroke-dasharray="120 332" stroke-dashoffset="-190"/><circle cx="0" cy="0" r="72" fill="none" stroke="#34d399" stroke-width="32" stroke-dasharray="60 392" stroke-dashoffset="-310"/></g></g><g><rect x="487" y="612" width="226" height="36" rx="18" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="501" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6eefc" text-anchor="start">Zoho CRM dashboard</text></g>
</svg>