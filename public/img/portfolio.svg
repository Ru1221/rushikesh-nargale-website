<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Selected automation projects">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1632"/><stop offset="1" stop-color="#12295a"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#2f80ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f80ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="8%" cy="95%" r="45%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".07"/></pattern>
<style>
.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.07)}}
.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes grow{50%{transform:scaleY(.82)}}
.wv{animation:wv 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.float,.spin,.grow,.wv{animation:none}}
</style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/><rect width="1200" height="675" fill="url(#g1)"/><rect width="1200" height="675" fill="url(#g2)"/>
<rect x="110" y="110" width="460" height="330" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M110 144H570" stroke="rgba(255,255,255,.14)"/><circle cx="132" cy="127" r="5" fill="#ff6b6b" /><circle cx="150" cy="127" r="5" fill="#fbbf24" /><circle cx="168" cy="127" r="5" fill="#34d399" /><text x="340" y="133" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6f8ab8" text-anchor="middle">n8n workflow</text><g class="pulse" style="animation-delay:0s"><circle cx="210" cy="280" r="40" fill="#2f80ff" opacity=".18"/><circle cx="210" cy="280" r="30" fill="#2f80ff" /></g><g class="pulse" style="animation-delay:1.3333333333333333s"><circle cx="340" cy="230" r="40" fill="#22d3ee" opacity=".18"/><circle cx="340" cy="230" r="30" fill="#22d3ee" /></g><g class="pulse" style="animation-delay:1.3333333333333333s"><circle cx="340" cy="340" r="40" fill="#2f80ff" opacity=".18"/><circle cx="340" cy="340" r="30" fill="#2f80ff" /></g><g class="pulse" style="animation-delay:0.3333333333333333s"><circle cx="470" cy="285" r="40" fill="#34d399" opacity=".18"/><circle cx="470" cy="285" r="30" fill="#34d399" /></g><path d="M210 280L340 230L470 285M210 280L340 340L470 285" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><path d="M210 280L340 230L470 285" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0s"/><path d="M210 280L340 340L470 285" fill="none" stroke="#2f80ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" class="flow" style="animation-delay:0.5s"/><rect x="640" y="170" width="450" height="330" rx="16" fill="#0f2144" stroke="rgba(255,255,255,.14)"/><path d="M640 204H1090" stroke="rgba(255,255,255,.14)"/><circle cx="662" cy="187" r="5" fill="#ff6b6b" /><circle cx="680" cy="187" r="5" fill="#fbbf24" /><circle cx="698" cy="187" r="5" fill="#34d399" /><text x="865" y="193" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6f8ab8" text-anchor="middle">Booking assistant</text><g><rect x="670" y="230" width="220" height="60" rx="18" fill="#12295a"/><path d="M692 288l-12 18l30 -18z" fill="#12295a"/><rect x="690" y="252" width="180" height="8" rx="4" fill="#fff" opacity="0.85"/><rect x="690" y="272" width="144" height="8" rx="4" fill="#fff" opacity="0.85"/></g><g><rect x="840" y="320" width="220" height="60" rx="18" fill="#2f80ff"/><path d="M1038 378l12 18l-30 -18z" fill="#2f80ff"/><rect x="860" y="342" width="180" height="8" rx="4" fill="#fff" opacity="0.85"/><rect x="860" y="362" width="144" height="8" rx="4" fill="#fff" opacity="0.85"/></g><circle cx="1040" cy="450" r="20" fill="#34d399" /><path d="M1030.909090909091 450 l7.692307692307692 8.333333333333334 l12.5 -13.333333333333334" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g class="float"><rect x="300" y="470" width="300" height="100" rx="20" fill="#12295a" stroke="rgba(255,255,255,.14)"/><text x="450" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6eefc" text-anchor="middle">Diabetes risk model</text></g>
</svg>